name: finpath-backtest
# Chay backtest chien luoc "Tich san trong Uptrend" (MA thang + timing 26/18 thang)
# cho VN-Index (MA10), BTC (MA13), Vang the gioi XAU/USD (MA21).
# Dung nguon mien phi cua vnstock (VCI/MSN) -- khong can VNSTOCK_API_KEY.
on:
  schedule:
    - cron: '15 2 1 * *'  # 1 ngay dau moi thang, 02:15 UTC (~09:15 gio VN)
  workflow_dispatch:
  push:  # TAM THOI: de kich hoat lan chay dau tien tu branch chua merge; se go bo sau khi xac nhan chay duoc that
    branches:
      - claude/trading-system-backtest-ntcgky

permissions:
  contents: write

concurrency:
  group: finpath-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-backtest-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
      - name: Cai thu vien (chi khi cache miss)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Backtest VN-Index (MA10)
        run: python backtest/run_backtest.py --asset vnindex
      - name: Backtest BTC/USD (MA13)
        run: python backtest/run_backtest.py --asset btc
        continue-on-error: true
      - name: Backtest Vang the gioi XAU/USD (MA21)
        run: python backtest/run_backtest.py --asset gold
        continue-on-error: true
      - name: Commit & push ket qua
        run: |
          git config user.name "finpath-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/backtest_*.json docs/backtest_*.md
          if git diff --cached --quiet; then echo "khong co thay doi"; else
            git commit -m "backtest: cap nhat ket qua $(date -u +%Y-%m-%d)"
            git fetch origin "${{ github.ref_name }}"
            git rebase -X theirs "origin/${{ github.ref_name }}" || git rebase --abort
            git push origin "HEAD:${{ github.ref_name }}"
          fi

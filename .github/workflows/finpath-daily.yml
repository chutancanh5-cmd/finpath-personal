name: finpath-daily
# Cap nhat day du cuoi phien. Tu 2026-08-21 PC la nguon chinh (task 'FinPath Daily PC'
# chay 15:10 VN, het ~20-25'); cloud chi chay BU khi PC im lang -- xem updater/ci_gate.py.
#
# CHU Y da bo cron 08:10 UTC (15:10 VN): no no DUNG LUC PC bat dau, khi do nhip tim con
# la cua hom qua nen cong chan luon cho chay -> cloud chay song song voi PC, trung Discord
# va tranh push. Chi giu 09:10 UTC (16:10 VN), luc PC chac chan da xong va day nhip tim.
on:
  schedule:
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finpath-data
  cancel-in-progress: false

jobs:
  # PC (IP nha) chay chinh vi VCI degrade nang voi IP datacenter cua GitHub:
  # price_board(100 ma) = 1.6s tren PC, timeout 30s lien tuc tren runner.
  # Job nay chi checkout + doc 1 file JSON nen bo qua chi ton ~10 giay.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # --same-day chu khong phai nguong gio: daily chay 1 lan/ngay nen "PC da chay
        # phien hom nay chua" moi la cau hoi dung. Nguong gio thi sau vai tieng se het
        # han va cong lai mo ra suot dem du PC da lam xong viec cua ngay.
        run: python3 updater/ci_gate.py --kind daily --same-day

  update:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_MARKETREAD: ${{ secrets.DISCORD_WEBHOOK_MARKETREAD }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ACCEPT_TC: "tôi đồng ý"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache trang thai license vnstock (~/.vnstock)
        uses: actions/cache@v4
        with:
          path: ~/.vnstock
          key: vnstock-license-v1
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
      - name: Cai thu vien (chi khi cache miss)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv --copies .venv && .venv/bin/pip install -r requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Cai vnstock_data (paid) neu chua co trong venv
        run: |
          if ! .venv/bin/python -c "import vnstock_data" 2>/dev/null; then
            echo "vnstock_data chua co, cai qua CLI installer chinh thuc..."
            .venv/bin/python -m ensurepip --upgrade -q 2>/dev/null || true
            .venv/bin/python -m pip install -q requests
            wget -qO vnstock-cli-installer.run https://vnstocks.com/files/vnstock-cli-installer.run
            chmod +x vnstock-cli-installer.run
            ./vnstock-cli-installer.run -- --non-interactive --api-key "$VNSTOCK_API_KEY" --venv-path "$PWD/.venv" --language en
          else
            echo "vnstock_data da co san trong venv cache, bo qua installer."
          fi
      # THU TU CO CHU DICH — QUAN TRONG TRUOC, NANG SAU.
      # Job nay chi chay khi PC TAT vao ngay giao dich, tuc dung luc VCI chan IP cloud
      # nang nhat. Do 2026-08-22: update_market_read mot minh het 18,5 phut, update_prices
      # them ~10 phut -> timeout 30' cat khi chua kip cham toi signals/trailstop/scan_daily.
      # Ban cu xep 2 script NANG NHAT len dau nen dung nhung thu quan trong nhat.
      # Nay: signals/trailstop/scan_daily (tin hieu + chan lai + quet cuoi phien) chay
      # TRUOC; market_read va update_market --append-hist xuong cuoi. Timeout co cat thi
      # chi mat phan it quan trong nhat.
      # Da bo update_orderflow va check_alerts: finpath-intraday da chay ca hai moi 5 phut.
      - name: Run full updaters
        working-directory: updater
        run: |
          python update_signals.py || true
          python update_trailstop.py || true
          python alert.py || true
          python scan_daily.py --discord || true
          python update_prices.py || true
          python update_market.py --append-hist || true
          python update_market_read.py --discord || true
      - name: Commit & push data
        run: |
          git config user.name "finpath-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git add updater/marketread_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "khong co thay doi"; else
            git commit -m "data: daily $(date -u +%H:%M) UTC"
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push
          fi
      - name: Bao loi ve Discord
        if: failure()
        run: |
          curl -s -X POST -H "Content-Type: application/json" -d "{\"username\":\"Bot CI\",\"content\":\"❌ Workflow **${{ github.workflow }}** lỗi — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$DISCORD_WEBHOOK_URL" || true

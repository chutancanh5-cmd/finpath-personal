name: finpath-daily
# Cap nhat day du cuoi phien. Tu 2026-08-21 PC la nguon chinh (task 'FinPath Daily PC'
# chay 15:10 VN, het ~20-25'); cloud chi chay BU khi PC im lang -- xem updater/ci_gate.py.
#
# CHU Y da bo cron 08:10 UTC (15:10 VN): no no DUNG LUC PC bat dau, khi do nhip tim con
# la cua hom qua nen cong chan luon cho chay -> cloud chay song song voi PC, trung Discord
# va tranh push. Chi giu 09:10 UTC (16:10 VN), luc PC chac chan da xong va day nhip tim.
on:
  schedule:
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finpath-data
  cancel-in-progress: false

jobs:
  # PC (IP nha) chay chinh vi VCI degrade nang voi IP datacenter cua GitHub:
  # price_board(100 ma) = 1.6s tren PC, timeout 30s lien tuc tren runner.
  # Job nay chi checkout + doc 1 file JSON nen bo qua chi ton ~10 giay.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # --same-day chu khong phai nguong gio: daily chay 1 lan/ngay nen "PC da chay
        # phien hom nay chua" moi la cau hoi dung. Nguong gio thi sau vai tieng se het
        # han va cong lai mo ra suot dem du PC da lam xong viec cua ngay.
        run: python3 updater/ci_gate.py --kind daily --same-day

  update:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_MARKETREAD: ${{ secrets.DISCORD_WEBHOOK_MARKETREAD }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ACCEPT_TC: "tôi đồng ý"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache trang thai license vnstock (~/.vnstock)
        uses: actions/cache@v4
        with:
          path: ~/.vnstock
          key: vnstock-license-v1
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
      - name: Cai thu vien (chi khi cache miss)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv --copies .venv && .venv/bin/pip install -r requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Cai vnstock_data (paid) neu chua co trong venv
        run: |
          if ! .venv/bin/python -c "import vnstock_data" 2>/dev/null; then
            echo "vnstock_data chua co, cai qua CLI installer chinh thuc..."
            .venv/bin/python -m ensurepip --upgrade -q 2>/dev/null || true
            .venv/bin/python -m pip install -q requests
            wget -qO vnstock-cli-installer.run https://vnstocks.com/files/vnstock-cli-installer.run
            chmod +x vnstock-cli-installer.run
            ./vnstock-cli-installer.run -- --non-interactive --api-key "$VNSTOCK_API_KEY" --venv-path "$PWD/.venv" --language en
          else
            echo "vnstock_data da co san trong venv cache, bo qua installer."
          fi
      # THU TU CO CHU DICH — QUAN TRONG TRUOC, NANG SAU.
      # Job nay chi chay khi PC TAT vao ngay giao dich, tuc dung luc VCI chan IP cloud
      # nang nhat. Do 2026-08-22: update_market_read mot minh het 18,5 phut, update_prices
      # them ~10 phut -> timeout 30' cat khi chua kip cham toi signals/trailstop/scan_daily.
      # Ban cu xep 2 script NANG NHAT len dau nen dung nhung thu quan trong nhat.
      # Nay: signals/trailstop/scan_daily (tin hieu + chan lai + quet cuoi phien) chay
      # TRUOC; market_read va update_market --append-hist xuong cuoi. Timeout co cat thi
      # chi mat phan it quan trong nhat.
      # Da bo update_orderflow va check_alerts: finpath-intraday da chay ca hai moi 5 phut.
      #
      # CUNG BO update_trailstop KHOI CLOUD (2026-08-22, quyet dinh cua chu du an):
      # do that te — update_signals mot minh het 18 phut tren cloud, trailstop can them
      # ~15-20 phut nua (15m35s ngay ca tren PC vi endpoint history cua VCI cham) -> hai
      # cai khong the cung nam trong 30 phut. Muon chua thi phai nang timeout, ma
      # finpath-daily dung chung concurrency 'finpath-data' voi finpath-intraday nen se
      # chan intraday suot 60 phut — dung ngay PC tat thi intraday lai la thu duy nhat
      # giu gia cap nhat. Chon giu signals (dan huong PrimeTrade) va chap nhan
      # trailstop.json khong doi trong ngay PC tat.
      # trailstop VAN CHAY tren PC qua run_daily.bat — do moi la nguon chinh.
      #
      # HAI LOP CHAN GIO (them 2026-09-05) — truoc day thieu ca hai nen job nay
      # chay 30' roi bi HUY o giua buoc nay, KHONG bao gio toi buoc commit:
      # moi thu update_signals/alert/scan_daily da lam xong deu bi vut di.
      # Do that: 4/5 lan chay gan nhat deu 'cancelled' o dung 30m, day khong day
      # duoc gi (27/08 - 03/09 mat trang 6 phien).
      #   1. timeout-minutes cua BUOC (25') < timeout-minutes cua JOB (30'):
      #      GitHub cat rieng buoc nay, job van song de chay tiep commit.
      #   2. `timeout <giay>` cho tung script: mot nguon treo (VCI hay timeout 30s
      #      x3 lan tenacity = 96s cho MOT loi call) khong an het phan cua script sau.
      - name: Run full updaters
        working-directory: updater
        timeout-minutes: 25
        run: |
          timeout 600 python update_signals.py || true
          timeout 120 python alert.py || true
          timeout 240 python scan_daily.py --discord || true
          # CBTT theo ma (~1,5 phut cho ~40 ma). Doc signals.json nen phai sau
          # update_signals. Dat o day chu khong phai cuoi: phan quan trong nhat
          # (signals/alert/scan) da xong, ma neu de cuoi thi voi timeout 30' cua job
          # nay no gan nhu khong bao gio chay toi.
          timeout 240 python update_symbol_news.py || true
          timeout 300 python update_prices.py || true
          timeout 300 python update_market.py --append-hist || true
          timeout 420 python update_market_read.py --discord || true
      # if: always() — buoc tren co bi timeout cat thi phan da lam duoc VAN duoc day len.
      - name: Commit & push data
        if: always()
        run: |
          git config user.name "finpath-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git add updater/marketread_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "khong co thay doi"; else
            git commit -m "data: daily $(date -u +%H:%M) UTC"
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push
          fi
      # cancelled() cung phai bao: het timeout-minutes cua job -> conclusion la
      # 'cancelled' CHU KHONG PHAI 'failure', nen `if: failure()` khong bat duoc.
      # Chinh vi vay job nay chet lang le suot 27/08 - 03/09 ma khong ai biet.
      - name: Bao loi ve Discord
        if: failure() || cancelled()
        run: |
          curl -s -X POST -H "Content-Type: application/json" -d "{\"username\":\"Bot CI\",\"content\":\"❌ Workflow **${{ github.workflow }}** lỗi — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$DISCORD_WEBHOOK_URL" || true

name: finpath-tinai
# Tin AI: quet RSS moi 5 phut, 24/7. RSS -> Claude (thue bao) -> ai_digest.json + news.json
# -> Discord kenh tin tuc.
#
# CHI CONG BO KHI CO TIN MOI. Job `check` chi doc RSS bang thu vien chuan (khong venv,
# khong vnstock, khong npm) nen cac lan khong co tin moi ket thuc trong vai chuc giay va
# KHONG: goi Claude, khong ban Discord, khong day gi len Prime Finance.
# Trang thai tin da thay nam o updater/news_seen.json (commit cung repo).
#
# concurrency RIENG (finpath-news): truoc day dung chung 'finpath-data' voi daily/intraday
# — o nhip 5 phut hai ben se lien tuc xep hang va huy nhau.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finpath-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
      # update_news.py --check-new chi dung thu vien chuan -> khong can setup-python,
      # khong can venv. Giu buoc nay that nhe vi no chay ~288 lan/ngay.
      - id: check
        name: Co tin moi khong
        run: python3 updater/update_news.py --check-new

  digest:
    needs: check
    if: needs.check.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # update_news.py tinh regime tu FRED (CPI/Fed/10Y/USD/dau/VIX) + VNINDEX qua vnstock.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache trang thai license vnstock (~/.vnstock)
        uses: actions/cache@v4
        with:
          path: ~/.vnstock
          key: vnstock-license-v1
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
      - name: Cai thu vien (chi khi cache miss)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv --copies .venv && .venv/bin/pip install -r requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Cai vnstock_data (paid) neu chua co trong venv
        run: |
          if ! .venv/bin/python -c "import vnstock_data" 2>/dev/null; then
            echo "vnstock_data chua co, cai qua CLI installer chinh thuc..."
            .venv/bin/python -m ensurepip --upgrade -q 2>/dev/null || true
            .venv/bin/python -m pip install -q requests
            wget -qO vnstock-cli-installer.run https://vnstocks.com/files/vnstock-cli-installer.run
            chmod +x vnstock-cli-installer.run
            ./vnstock-cli-installer.run -- --non-interactive --api-key "$VNSTOCK_API_KEY" --venv-path "$PWD/.venv" --language en
          else
            echo "vnstock_data da co san trong venv cache, bo qua installer."
          fi
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      # Lay lai RSS: job `check` chay tren runner KHAC nen _rss_raw.json cua no khong con.
      - name: Dump RSS tho
        run: python updater/update_news.py --rawdump
      - name: AI digest (Claude thue bao)
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Chua co CLAUDE_CODE_OAUTH_TOKEN -> bo qua AI, giu digest cu"
          else
            cat updater/ai_prompt_ci.txt | claude -p --model claude-opus-5 --permission-mode acceptEdits || echo "claude loi -> giu digest cu"
          fi
      # Tom tat 'y chinh' cho tung tin sap dang len kenh tin tuc (docs/data/_moi_raw.json
      # do buoc --rawdump o tren ghi ra khi co tin moi). update_news.py --discord se doc
      # ket qua nay; neu buoc nay bo qua/loi thi tu roi ve mo ta RSS/meta trang bao.
      - name: AI tom tat tin dang Discord (Claude thue bao)
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ ! -f docs/data/_moi_raw.json ]; then
            echo "Chua co token hoac khong co tin moi -> bo qua"
          else
            cat updater/ai_prompt_discord_ci.txt | claude -p --model claude-opus-5 --permission-mode acceptEdits || echo "claude loi -> Discord dung mo ta RSS/meta thay AI"
          fi
      # --discord: ghi news.json + ban tin MOI ve kenh tin tuc. Chi ghi nhan vao
      # news_seen.json SAU KHI ban thanh cong, nen Discord loi thi lan sau bao lai.
      - name: Merge tin + bao Discord
        run: python updater/update_news.py --discord
      - name: Commit & push
        run: |
          git config user.name "finpath-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/ai_digest.json docs/data/news.json updater/news_seen.json
          if git diff --cached --quiet; then echo "khong co thay doi"; else
            git commit -m "Tin AI: $(date +%F_%H:%M)"
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push
          fi
      - name: Bao loi ve Discord
        if: failure()
        run: |
          curl -s -X POST -H "Content-Type: application/json" -d "{\"username\":\"Bot CI\",\"content\":\"❌ Workflow **${{ github.workflow }}** lỗi — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$DISCORD_WEBHOOK_URL" || true
